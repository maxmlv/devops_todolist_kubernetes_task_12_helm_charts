common:
  namespace: todoapp

secrets:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

deployment:
  resources:
    requests:
      memory: 256Mi
      cpu: 150m
    limits:
      memory: 256Mi
      cpu: 150m
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
  image:
    repo: ikulyk404/todoapp
    tag: 4.0.1
  affinity:
    key: app
    value: todoapp

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 70

pv:
  capasity: 1Gi

pvc:
  requests: 1Gi

rbac:
  serviceAccountName: secrets-reader
  role:
    rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "watch", "list"]